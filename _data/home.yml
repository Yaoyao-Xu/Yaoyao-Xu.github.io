# Research framing follows the thesis proposal: representation, simulation, design.
# Feature first-author work here; the full publication list retains collaborations.
research:
  - number: "01"
    title: Representation
    subtitle: Proteins and chemical reasoning
    description: Learning task-aware protein representations and organizing chemical reasoning capabilities through negative sample mining and multi-teacher distillation.
    topics:
      - Protein language models
      - Task-aware learning
      - Chemical reasoning
    papers:
      - protein-lm
      - chemopd
  - number: "02"
    title: Simulation
    subtitle: Multiscale protein dynamics
    description: Developing generative models for ordered protein conformational dynamics across temporal scales, with an interest in controllable and uncertainty-aware simulation.
    topics:
      - Protein dynamics
      - Multiscale generation
      - Controllable simulation
    papers:
      - tempo-extended
      - tempo
  - number: "03"
    title: Design
    subtitle: Closed-loop molecular discovery
    description: Using semantic language-model surrogates and iterative oracle feedback to guide molecular inverse design, and exploring how simulation and chemical reasoning can inform design decisions.
    topics:
      - Molecular inverse design
      - Semantic surrogates
      - Feedback-guided optimization
    papers:
      - closed-loop-molecular-design
